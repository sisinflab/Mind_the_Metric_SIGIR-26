experiment:
  data_config:
    strategy: fixed
    train_path: ../data/{0}/train_gfcf.tsv
    test_path: ../data/{0}/test_gfcf.tsv

  dataset: yelp2018
  top_k: 20
  evaluation:
    cutoffs: 20
    simple_metrics: [Recall, nDCG]

  gpu: 0
  external_models_path: ../external/models/__init__.py

  models:
    external.PGSP:
      meta:
        verbose: False
      factors: 512 #[256, 512, 1024]
      phi: 0.8 #[0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
      P0_: False #[True, False]
      P1_: False #[True, False]
      seed: 42