experiment:

  backend: pytorch

  data_config:
    strategy: fixed
    train_path: ../data/{0}/train_higsp.tsv
    validation_path: ../data/{0}/valid_higsp.tsv
    test_path: ../data/{0}/test_higsp.tsv

  dataset: ml-100k
  top_k: 20
  evaluation:
    cutoffs: [5,10,20]
    simple_metrics: [Precision, Recall, F1, MRR, nDCG]

  gpu: 0
  external_models_path: ../external/models/__init__.py

  models:
    external.HiGSP:
      meta:
        save_recs: False
        verbose: True
      batch_eval: 1024
      alpha_1: 0.08
      alpha_2: 0.73
      order_1: 2
      order_2: 12
      pri_factor: 80
      n_clusters: 25
      seed: 42