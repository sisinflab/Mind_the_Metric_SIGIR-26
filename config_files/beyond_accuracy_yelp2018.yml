experiment:
  backend: pytorch

  data_config:
    strategy: fixed
    train_path: ../data/{0}/splitting/0/0/train.tsv
    validation_path: ../data/{0}/splitting/0/0/val.tsv
    test_path: ../data/{0}/splitting/0/test.tsv
  dataset: yelp2018

  top_k: 20
  evaluation:
    cutoffs: [20]
    simple_metrics: [Recall, nDCG, Gini, EPC, EFD, PopREO, ACLT, ItemCoverage]

  gpu: 0
  external_models_path: ../external/models/__init__.py

  models:

    Random:
      meta:
        save_recs: False
        verbose: False
      seed: 42

    MostPop:
      meta:
        save_recs: False
        verbose: False

    ItemKNN:
      meta:
        save_recs: False
        verbose: False
      neighbors: 838
      asymmetric_alpha: 0.6481199645687472
      tversky_alpha: 1.8400184528746324
      tversky_beta: 1.0868061353806249
      similarity: tversky

    external.GFCF:
      meta:
        save_recs: False
        verbose: False
      batch_eval: 512
      svd_factors: 256
      alpha: 0.21948822034403112
      seed: 2026

    external.LightGCN:
      meta:
        verbose: False
        save_weights: False
        validation_metric: Recall@20
        validation_rate: 10
      lr: 0.001
      epochs: 1000
      factors: 64
      batch_size: 2048
      l_w: 0.0002537400642283649
      n_layers: 3
      normalize: True
      seed: 42
      early_stopping:
        patience: 5
        mode: auto
        monitor: Recall@20
        verbose: True

    Slim:
      meta:
        save_recs: False
        verbose: False
        validation_metric: Recall@20
        hyper_max_evals: 20
        hyper_opt_alg: tpe
      alpha: 0.007452223545183899
      l1_ratio: 0.002366475312508242
      neighborhood: 518

    external.PGSP:
      meta:
        save_recs: False
        verbose: False
        validation_metric: Recall@20
      factors: 512
      phi: 0.6
      P0_: False
      P1_: True
      seed: 42

    external.FaGSP:
      meta:
        save_recs: False
        verbose: True
        validation_metric: Recall@20
      batch_eval: 256
      pri_factor1: 512
      pri_factor2: 128
      alpha_1: 0.45
      alpha_2: 0.8
      order1: 4
      order2: 4
      q: 0.75

    external.HiGSP:
      meta:
        save_recs: False
        verbose: True
        validation_metric: Recall@20
      batch_eval: 256
      pri_factor: 256
      alpha_1: 0.75
      alpha_2: 0.35
      order1: 8
      order2: 4
      n_clusters: 3

    external.BSPM:
      meta:
        validation_metric: Recall@20
        verbose: False
        save_recs: False
      batch_eval: 512
      factors: 539
      idl_solver: euler
      blur_solver: rk4
      sharpen_solver: euler
      K_idl: 2
      T_idl: 4.8
      K_b: 2
      T_b: 1.9
      K_s: 3
      T_s: 1.4
      idl_beta: 0.2
      final_sharpening: False
      sharpening_off: False
      t_point_combination: True
      seed: 42

    external.TurboCF:
      meta:
        save_recs: False
        verbose: False
        validation_metric: Recall@20
      alpha: 0.5
      power: 0.8
      filter: 1
      batch_eval: 1024
      seed: 2022

    external.ChebyCF:
      meta:
        save_recs: False
        verbose: False
        validation_metric: Recall@20
      batch_eval: 1024
      K: 8
      phi: 1.0
      eta: 256
      alpha: 0.4
      beta: 0.0
      seed: 42