experiment:

  data_config:
    strategy: dataset
    dataset_path: ../data/{0}/douban_0$85.tsv  # it contains the 85% of the entire dataset

  splitting:
    save_on_disk: True
    save_folder: ../data/{0}/splitting
    test_splitting:
      strategy: random_subsampling
      # we need the 20% of the entire dataset
      # that is 0.2/0.85 = 23% from douban_0$85
      # test (discarded) of 77% from douban_0$85
      test_ratio: 0.77
    validation_splitting:
      strategy: random_subsampling
      # for the validation set, we always retain the 15% from the training set
      test_ratio: 0.15

  dataset: douban_0_2

  top_k: 20
  evaluation:
    cutoffs: [10, 20]
    simple_metrics: [Recall, nDCG]

  gpu: 0
  external_models_path: ../external/models/__init__.py

  models:

    Random:
      meta:
        save_recs: False
        verbose: False
      seed: 42